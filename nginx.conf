# ============================================================
# Huddle — конфиг nginx (reverse proxy)
# ============================================================
# Раздаёт статику (index.html, admin.html)
# Проксирует API и WebSocket на Node.js-сервер
# ============================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Логи
    access_log  logs/huddle_access.log;
    error_log   logs/huddle_error.log warn;

    # Оптимизация
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Gzip (сжатие)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript 
               text/xml application/xml application/xml+rss text/javascript;

    # Размер загружаемых файлов (для медиа до 3 ГБ)
    client_max_body_size 3072M;
    client_body_timeout 300s;
    client_header_timeout 300s;

    # WebSocket требует апгрейд соединения
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen       80;
        server_name  localhost;  # ← ЗАМЕНИ на свой домен, когда купишь

        # Статические файлы (index.html, admin.html, manifest.json)
        root C:/Users/ЯНРС/Desktop/social-network/packages/frontend;
        index index.html;

        # API → Node.js сервер
        location /api/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Таймауты для долгих запросов (загрузка файлов)
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_connect_timeout 10s;
        }

        # WebSocket → Node.js сервер
        location /ws {
            proxy_pass http://127.0.0.1:8787;
            proxy_http_version 1.1;
            
            # Апгрейд до WebSocket
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # WebSocket должен жить долго
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Записи звонков (статика с поддержкой Range)
        location /recordings/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            
            # Range-запросы для видео (перемотка)
            proxy_force_ranges on;
            proxy_read_timeout 300s;
        }

        # Всё остальное — статика (HTML, CSS, JS)
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Кэширование статики
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }
}